site_name: Time Series Forecasting
site_description: Energy forecasting and flexibility analysis
site_author: Rhys Wells
repo_url: https://github.com/rhyslwells/time-series-project
repo_name: time-series-project
docs_dir: docs_src
site_dir: docs

theme:
  name: material
  palette:
    - scheme: dark
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: light
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Findings:
      - findings/index.md
      - SARIMA Forecasting: findings/sarima_forecasting.md
      - Asset Profiling: findings/asset_profiling.md
  - Methodology:
      - methodology/index.md
  - Data:
      - data/index.md
      - Data Generation: data/data_generation.md
      - Synthetic Metering Data: data/synthetic_metering_data.md
  - Exploration Notebooks: notebooks.md
  - Coding:
      - MkDocs Setup: coding/mkdocs.md

plugins:
  - search
  - marimo
  - plotly

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.emoji
  - tables
  - admonition
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details
  - pymdownx.blocks.html
  - pymdownx.blocks.tab
