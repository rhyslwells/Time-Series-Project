site_name: Time Series Forecasting
site_description: Energy forecasting and flexibility analysis
site_author: Rhys Wells
repo_url: https://github.com/rhyslwells/time-series-project
repo_name: time-series-project
docs_dir: docs_src
site_dir: docs
edit_uri: edit/main/docs_src/
copyright: '© 2026 Rhys Wells'

watch:
  - docs_src/

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rhyslwells/time-series-project

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

exclude_docs: |
  README.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - class: mermaid
          name: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tilde

nav:
  - Home: index.md
  - Data:
      - data/index.md
      - Data generation: data/data_generation.md
      - Feature engineering: data/feature_engineering.md
      - Synthetic metering data: data/synthetic_metering_data.md
  - Theory:
      - theory/index.md
      - Metrics: theory/metrics.md
      - Models: theory/models.md
      - Diagnostics: theory/diagnostics.md
      - Decisions: theory/models-decisions.md
      - Forecast products: theory/forecast_products.md
  - Coding:
      - coding/index.md
      - Framework usage: coding/framework_usage.md
      - MkDocs setup: coding/mkdocs.md
  - Notebooks:
      - notebooks/notebooks.md
      - SARIMA forecasting: notebooks/sarima.md
      - Model comparison: notebooks/ts_model_explorer.md
  - Findings:
      - findings/index.md
      - Asset profiling: findings/asset_profiling.md

plugins:
  - search
  - marimo
  - git-revision-date-localized:
      fallback_to_build_date: true
  - tags

validation:
  links:
    anchors: warn

theme:
  name: material
  palette:
    # Palette toggle for system preference
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: blue
      accent: blue
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: blue
      accent: blue
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - content.code.copy
    - header.autohide
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.prune
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

  font:
    code: Fira Mono
    text: PT Sans
