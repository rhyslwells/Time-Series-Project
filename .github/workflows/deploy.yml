name: Deploy Docs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install mkdocs mkdocs-material

      - run: mkdocs build --site-dir docs

      - uses: actions/upload-artifact@v3
        with:
          name: docs
          path: docs/
