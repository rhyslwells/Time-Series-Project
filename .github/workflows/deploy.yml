name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs_src/**'
      - 'mkdocs.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install mkdocs mkdocs-material mkdocs-marimo mkdocs-git-revision-date-localized-plugin

      - run: mkdocs build

      - name: Commit and push built docs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          git commit -m "Build documentation [skip ci]" || true
          git push
