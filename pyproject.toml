[project]
name = "time-series-forecasting"
version = "0.1.0"
description = "Time series forecasting and analysis for energy systems"
authors = [
    {name = "Rhys Wells" }
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Forecasting core
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    # Time series specific
    # Data handling
    "polars>=0.20.0",
    "numpy>=1.26.0",
    # Exploration and visualization
    "marimo>=0.1.0",
    "matplotlib>=3.7.0",
    "plotly>=5.0.0",
    "seaborn>=0.13.0",
    # IPython
    "ipython>=8.0.0",
    "ipykernel>=6.0.0",
    "nbformat>=5.11.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

docs = [
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0",
    "mkdocs-marimo>=0.2.0",
    "mkdocs-plotly-plugin>=0.1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
