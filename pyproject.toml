[project]
name = "time-series-forecasting"
version = "0.1.0"
description = "Time series forecasting and analysis for energy systems"
authors = [
    {name = "Rhys Wells", email = "rhys.wells@flexitricity.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Forecasting core
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.0.0",

    # Time series specific
    "sktime>=0.26.0",
    "tbats>=1.1.0",
    "pmdarima>=2.0.0",

    # Data handling
    "pandas>=2.0.0",
    "numpy>=1.26.0",

    # Exploration and visualization
    "marimo>=0.1.0",
    "matplotlib>=3.7.0",
    "plotly>=5.0.0",
    "seaborn>=0.13.0",

    # IPython
    "ipython>=8.0.0",
    "ipykernel>=6.0.0",

    # Utilities
    "python-dateutil>=2.8.0",
    "pytz>=2024.0",
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
python-version = "3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
