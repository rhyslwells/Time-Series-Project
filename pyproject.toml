[project]
name = "time-series-forecasting"
version = "0.1.0"
description = "Time series forecasting and analysis for energy systems"
authors = [
    {name = "Rhys Wells" }
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Forecasting core
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    # Time series specific
    # Data handling
    "polars>=0.20.0",
    "numpy>=1.26.0",
    # Exploration and visualization
    "marimo>=0.1.0",
    "matplotlib>=3.7.0",
    "plotly>=5.0.0",
    "seaborn>=0.13.0",
    # IPython
    "ipython>=8.0.0",
    "ipykernel>=6.0.0",
    "nbformat>=5.11.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

docs = [
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0",
    "mkdocs-marimo>=0.2.0",
    "mkdocs-plotly-plugin>=0.1.3",
    "marimo_docs",
    "ruff>=0.15.18",
    "mkdocs>=1.6.1",
    # `mkdocs serve` silently loses live reload on click 8.3.x: MkDocs declares
    # --no-livereload/--livereload as a feature switch group, and click 8.3
    # dropped the explicit `default=True` on the second option. Fixed in click
    # 8.4.0, so require that here rather than pinning mkdocs-material back to
    # 9.6.20 (the last release that capped click<8.2.2, which used to mask it).
    # https://github.com/squidfunk/mkdocs-material/issues/8478
    "click>=8.4",
    # 9.7.5+ drops the `pymdown-extensions~=10.2` cap and caps `mkdocs<2`.
    "mkdocs-material>=9.7.5",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-autorefs>=1.2.2",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocs-macros-plugin>=1.3.7",
    "mkdocs-redirects>=1.2.2",
    "mkdocs-click>=0.8.1",
    "mike>=2.0.0",  # for versioning
    "pillow>=10.2.0,!=11.3.0",  # for social cards, 11.3.0 doesn't have manylinux wheels
    "cairosvg>=2.7.1",  # for social cards
    "mdx-include>=1.4.2",
    "pymdown-extensions>=10.21.2",
    "lzstring>=1.0.4",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
